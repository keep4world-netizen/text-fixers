<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#26282b;--card:#33363a;--ink:#f2efec;--muted:#b4aea8;--line:#4a4e53;--accent:#ff7a1a;--accent-ink:#1d1f21;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:8px 16px 12px;height:100%;display:flex;flex-direction:column}
.logo{display:block;width:56px;height:56px;margin:0 auto;flex:none}
h1{font-size:1.6rem;font-weight:700;text-align:center;margin:4px 0 4px;letter-spacing:.04em;color:var(--accent)}
label.t{display:block;font-weight:600;margin:8px 0 4px;flex:none}
.box{width:100%;flex:1 1 0;min-height:64px;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;resize:none;text-align:left}
#inp{direction:ltr}
#out{font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9;white-space:pre-wrap;word-wrap:break-word;text-align:right;direction:rtl}
.row{display:flex;gap:8px;margin-top:8px;justify-content:flex-end;flex:none}
button{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt{display:flex;gap:10px;align-items:center;margin-top:8px;flex:none;color:var(--muted);font-size:.9rem}
.opt input{accent-color:var(--accent);width:18px;height:18px;flex:none}
#msg{flex:1;align-self:center;text-align:left;color:var(--accent);font-size:.85rem;margin:0}
</style>
</head>

<h1>Text Fixers</h1>

<label class="t" for="inp">Your Text</label>
<textarea id="inp" class="box" dir="ltr" placeholder="insert your text..."></textarea>
<div class="row">
  <button class="main" id="paste" title="Paste" aria-label="Paste">
    <svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/></svg>
  </button>
  <button id="clear" title="Clear" aria-label="Clear">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
  </button>
</div>
<label class="opt"><input type="checkbox" id="md"> Remove the symbols (* , # , ...) from your text</label>

<label class="t">Fixed Text</label>
<div id="out" class="box" aria-live="polite"></div>
<div class="row">
  <div id="msg" role="status"></div>
  <button class="main" id="copy" title="Copy" aria-label="Copy">
    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
  </button>
</div>
</main>
<script>
var RLM="\u200f", inp=document.getElementById("inp"), out=document.getElementById("out"),
    md=document.getElementById("md"), msg=document.getElementById("msg"), result="";
var WORD="[A-Za-z0-9]+[+#]*(?:[._\\-+\\/:@%&'?=~]+[A-Za-z0-9]+[+#]*)*\\/?";
var LATIN=new RegExp(WORD+"(?:[ \\t]+"+WORD+")*","g");
var PUNCT=/[.,:;!?)\]»،؛؟"'…]/;
function fix(t){
  t=t.replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,"");
  if(md.checked){
    t=t.replace(/^\s{0,3}#{1,6}\s*/gm,"").replace(/\*\*(.+?)\*\*/g,"$1")
       .replace(/__(.+?)__/g,"$1").replace(/`([^`\n]+)`/g,"$1").replace(/^(\s*)[-*]\s+/gm,"$1• ");
  }
  t=t.replace(LATIN,function(m,off,s){var n=s.charAt(off+m.length);return(n===""||n==="\n"||PUNCT.test(n))?m+RLM:m});
  return t.split("\n").map(function(l){
    return /[\u0600-\u06FF]/.test(l)?RLM+l:l;
  }).join("\n");
}
function run(){result=fix(inp.value);out.textContent=result}
function say(s){msg.textContent=s;setTimeout(function(){msg.textContent=""},2500)}
inp.addEventListener("input",run);md.addEventListener("change",run);
document.getElementById("clear").onclick=function(){inp.value="";run();inp.focus()};
document.getElementById("paste").onclick=function(){
  try{
    navigator.clipboard.readText().then(function(x){inp.value=x;run();say("Pasted")},
      function(){say("Clipboard blocked. Long-press the box and tap Paste.")});
  }catch(e){say("Long-press the box and tap Paste.")}
};
document.getElementById("copy").onclick=function(){
  if(!result){say("Nothing to copy yet.");return}
  function fallback(){
    var r=document.createRange();r.selectNodeContents(out);
    var s=getSelection();s.removeAllRanges();s.addRange(r);
    try{document.execCommand("copy");say("Copied")}catch(e){say("Text selected. Copy it manually.")}
  }
  try{navigator.clipboard.writeText(result).then(function(){say("Copied")},fallback)}catch(e){fallback()}
};
run();
if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js')}catch(e){}})}
</script>
</body>
